name: Auto fetch for snowflake

on:
  push:
    branches: [ "dev", "main" ]

permissions:
  contents: read

jobs:
  run-snowflake-fetch:
    runs-on: ubuntu-latest
    steps:
    # Step 1: Check out your repository's code
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Create the config.toml file from your GitHub Secret
    - name: Set up Snowflake connection config file
      env:
        SNOWCLI_CONFIG: ${{secrets.SNOWCLI_CONFIG}}
      shell: bash
      run: |
        echo -e "$SNOWCLI_CONFIG" > config.toml
        # Snowflake CLI requires strict permissions on the config file
        chmod 600 config.toml
    
    # Step 3: Install the Snowflake CLI using the correct action with correct casing
    - name: Install Snowflake CLI
      uses: Snowflake-Labs/setup-snow-cli@v1 # <-- THIS LINE IS THE FIX
      with:
        snow-cli-version: "latest"

    # Step 4: Run the fetch command using the now-installed CLI
    - name: Fetch the latest update from Github
      run: |
        snow sql -q "ALTER GIT REPOSITORY SNOW_CICD FETCH;" --config-file config.toml
