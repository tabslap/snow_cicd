name: Snowflake Auto Fetch

permissions:
  contents: write

on:
  push:
   branches: [ "main","dev" ]
  pull_request:
   branches: [ "main","dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore private key
        run: |
          printf "%s" "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > rsa_key.p8
          chmod 600 rsa_key.p8

      - name: Create SnowCLI config file
        run: |
          cat <<EOF > config.toml
          [connections.default]
          account = "${{ secrets.SNOW_ACCOUNT }}"
          user = "${{ secrets.SNOW_USER }}"
          role = "${{ secrets.SNOW_ROLE }}"
          warehouse = "${{ secrets.SNOW_WAREHOUSE }}"
          private_key_path = "rsa_key.p8"
          authenticator = "SNOWFLAKE_JWT"
          EOF
          chmod 600 config.toml

      - name: Create git-manifest.json and push (skip CI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ensure auth for push
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          python - <<'PY'
          import subprocess, json, sys
          files = []
          # list files under ddl and procedures (adjust paths if needed)
          paths = subprocess.check_output(["bash","-lc","git ls-files ddl procedures || true"]).decode().splitlines()
          for p in paths:
            p = p.strip()
            if not p: continue
            # last commit ISO timestamp
            ts = subprocess.check_output(["git","log","-1","--format=%cI","--",p]).decode().strip()
            files.append({"path": p, "last_commit": ts})
          open("git-manifest.json","w").write(json.dumps(files, indent=2))
          print("Wrote git-manifest.json with", len(files), "entries")
          PY

          git add git-manifest.json
          git commit -m "update git-manifest [skip ci]" || echo "no changes to manifest"
          git push origin HEAD || echo "push failed"




      - uses: Snowflake-Labs/snowflake-cli-action@v1.5

      - name: Alter Snowflake Git Repo Fetch
        run: snow sql -q "ALTER GIT REPOSITORY ${{ secrets.SNOW_DATABASE }}.${{ secrets.SNOW_SCHEMA }}.SNOW_CICD FETCH;"
 
