name: showcase_cicd_snowflake

on:
  push:
    branches:
      - main
    paths:
      - 'ddl/**'
      - 'procedures/**'
      - 'tasks/**'
  workflow_dispatch:

jobs:
  schemachange:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show workspace (debug)
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE/ddl" || true
          ls -la "$GITHUB_WORKSPACE/procedures" || true
          ls -la "$GITHUB_WORKSPACE/tasks" || true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install schemachange
        run: |
          python -m pip install --upgrade pip
          pip install schemachange

      - name: Run schemachange (DDL folder)
        env:
          SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_ROLE: ${{ secrets.SF_ROLE }}
          SF_WAREHOUSE: ${{ secrets.SF_WAREHOUSE }}
          SF_DATABASE: ${{ secrets.SF_DATABASE }}
          SF_PASSWORD: ${{ secrets.SF_PASSWORD }}
        run: |
          # Path to your change scripts (adjust if different)
          ROOT_FOLDER="$GITHUB_WORKSPACE/ddl"
          echo "Running schemachange for folder: $ROOT_FOLDER"

          schemachange \
            -f "$ROOT_FOLDER" \
            -a "$SF_ACCOUNT" \
            -u "$SF_USERNAME" \
            -r "$SF_ROLE" \
            -w "$SF_WAREHOUSE" \
            -d "$SF_DATABASE" \
            -c "$SF_DATABASE.SCHEMACHANGE.CHANGE_HISTORY" \
            --create-change-history-table
